<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">

    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description | default: site.github.project_tagline }}">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>

  <body>
    <section class="page-header">
      <h1 class="project-name">{{ site.title | default: site.github.repository_name }}</h1>
      <h2 class="project-tagline">{{ site.description | default: site.github.project_tagline }}</h2>

      <nav class="site-menu">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="https://lu-brito.github.io/datacommons/">Data Commons</a>
        <a href="https://www.instagram.com/wide_workshop/">WIDE</a>
        <a href="https://github.com/Lu-Brito">GitHub</a>
      </nav>
    </section>

    <section class="main-content">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-owner">
          This site is maintained by <a href="https://github.com/Lu-Brito">Lu Brito</a>.
        </span>
      </footer>
    </section>
  </body>
</html>
